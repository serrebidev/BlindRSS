[pytest]
testpaths = tests
# The repository has no workflow that consumes pytest's last-failed cache, and
# stale cache ACLs on Windows produced warnings after an interrupted build.
# Keep deterministic temp files but disable that nonessential persistent cache.
# SeleniumBase is an app dependency, not a test plugin; its pytest plugin
# clashes with pytest-playwright over --browser and aborts every run.
addopts = --basetemp=.tmp_test/pytest -p no:cacheprovider -p no:seleniumbase
filterwarnings =
    # mf2py (pulled in by extruct for core/metadata_enrich) still calls
    # codecs.open() in mf2py/backcompat.py, which Python 3.14 deprecated.
    # Third-party, not fixable here; matched by exact message + module.
    ignore:codecs\.open\(\) is deprecated:DeprecationWarning:mf2py\.backcompat
