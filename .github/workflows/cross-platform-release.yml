name: Cross-Platform Builds

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and upload assets for
        required: true
        type: string
      build_windows:
        description: Build Windows assets in CI (disable when build.bat already published them)
        required: false
        default: true
        type: boolean
      build_linux:
        description: Build Linux assets in CI (disable when serrebiradio built them)
        required: false
        default: true
        type: boolean
      publish_assets:
        description: Upload assets and manifests to the release (off = workflow artifacts only)
        required: false
        default: true
        type: boolean
      publish_release:
        description: After every asset is uploaded, publish the draft release as Latest
        required: false
        default: false
        type: boolean
      signing_policy:
        description: SignPath signing policy for Windows (release-signing needs approval in SignPath)
        required: false
        default: release-signing
        type: choice
        options:
          - release-signing
          - test-signing
  # cloud-release.yml calls this after it has tagged a draft release.
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      ref:
        description: Git ref to build (defaults to release_tag; a dry run passes a commit SHA)
        required: false
        default: ""
        type: string
      build_windows:
        required: false
        default: true
        type: boolean
      build_linux:
        required: false
        default: true
        type: boolean
      publish_assets:
        required: false
        default: true
        type: boolean
      publish_release:
        required: false
        default: false
        type: boolean
      signing_policy:
        required: false
        default: release-signing
        type: string
    secrets:
      SIGNPATH_API_TOKEN:
        required: false

permissions:
  contents: write
  actions: read

env:
  SIGNPATH_ORGANIZATION_ID: 9fb29c12-10be-42a0-b481-dc5965f315af
  SIGNPATH_PROJECT_SLUG: BlindRSS
  SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: exe-in-zip

jobs:
  # Windows is built and signed here only. The certificate is issued to SignPath
  # Foundation and lives in SignPath's HSM; SignPath signs nothing that was not
  # built from this repository on a GitHub-hosted runner, so there is no local
  # signing path for a release. Two signing requests per build: BlindRSS.exe
  # first, so the ZIP and the installer both carry the signed exe, then the
  # installer itself. release-signing waits for the approver in SignPath.
  windows:
    name: Build Windows Artifact
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install VLC and Inno Setup
        run: |
          choco install vlc --no-progress -y
          choco install innosetup --no-progress -y

      - name: Build application
        run: .\build.bat app

      # SignPath refuses a file whose version resource is not this exact version.
      - name: Read built version
        id: built
        run: |
          $v = (Get-Item dist\BlindRSS\BlindRSS.exe).VersionInfo.ProductVersion
          if (-not $v) { throw "BlindRSS.exe has no product version" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned executable
        id: unsigned_exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe-${{ inputs.release_tag }}
          path: dist/BlindRSS/BlindRSS.exe
          if-no-files-found: error
          overwrite: true

      - name: Sign executable with SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ inputs.signing_policy }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned_exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          parameters: |
            version: ${{ toJSON(steps.built.outputs.version) }}
          output-artifact-directory: signed/exe

      - name: Package ZIP and installer around the signed executable
        run: |
          Copy-Item signed\exe\BlindRSS.exe dist\BlindRSS\BlindRSS.exe -Force
          .\build.bat package

      - name: Upload unsigned installer
        id: unsigned_installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer-${{ inputs.release_tag }}
          path: dist/BlindRSS-Setup-v*.exe
          if-no-files-found: error
          overwrite: true

      - name: Sign installer with SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ inputs.signing_policy }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned_installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          parameters: |
            version: ${{ toJSON(steps.built.outputs.version) }}
          output-artifact-directory: signed/installer

      # Nothing unsigned or half-signed may ship: the exe in dist, the exe inside
      # the ZIP and the installer must all carry the same signer. release-signing
      # chains to a trusted root, so only Valid passes. test-signing uses an
      # untrusted test certificate, which Windows reports as UnknownError or
      # NotTrusted; a tampered file is HashMismatch and never passes.
      - name: Verify Authenticode signatures
        id: verify
        run: |
          $version = "${{ inputs.release_tag }}".TrimStart('v')
          $installer = "dist\BlindRSS-Setup-v$version.exe"
          Copy-Item "signed\installer\BlindRSS-Setup-v$version.exe" $installer -Force
          $okStatus = if ("${{ inputs.signing_policy }}" -eq "release-signing") { @("Valid") } else { @("Valid", "UnknownError", "NotTrusted") }
          $unzipped = Join-Path $env:RUNNER_TEMP "zipcheck"
          Expand-Archive "dist\BlindRSS-v$version.zip" $unzipped -Force
          $zipExe = (Get-ChildItem $unzipped -Recurse -Filter BlindRSS.exe | Select-Object -First 1).FullName
          if (-not $zipExe) { throw "BlindRSS.exe is missing from the ZIP" }
          $pinned = (Get-AuthenticodeSignature "dist\BlindRSS\BlindRSS.exe").SignerCertificate.Thumbprint
          if (-not $pinned) { throw "dist\BlindRSS\BlindRSS.exe is not signed" }
          foreach ($f in @("dist\BlindRSS\BlindRSS.exe", $zipExe, $installer)) {
            $sig = Get-AuthenticodeSignature $f
            $thumb = if ($sig.SignerCertificate) { $sig.SignerCertificate.Thumbprint } else { "" }
            $status = "$($sig.Status)"
            if ($thumb -ne $pinned) { throw "$f is not signed by the same certificate as BlindRSS.exe (status $status, signer '$thumb')" }
            if ($status -notin $okStatus) { throw "$f signature is $status" }
            "$f signed by $($sig.SignerCertificate.Subject) ($status)"
          }
          "thumbprint=$pinned" >> $env:GITHUB_OUTPUT

      - name: Compute checksums and write update manifest
        id: manifest
        run: |
          $version = "${{ inputs.release_tag }}".TrimStart('v')
          $zip = "dist\BlindRSS-v$version.zip"
          $installer = "dist\BlindRSS-Setup-v$version.exe"
          $zipSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $installerSha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $thumbprint = "${{ steps.verify.outputs.thumbprint }}"
          # Same notes summary build.bat puts in the manifest.
          $prevTag = (git describe --tags --abbrev=0 "HEAD^" 2>$null)
          $summary = Join-Path $env:RUNNER_TEMP "notes-summary.txt"
          .venv\Scripts\python.exe tools\release.py write-notes --from-tag "$prevTag" --to-tag "${{ inputs.release_tag }}" `
            --output (Join-Path $env:RUNNER_TEMP "notes.md") --summary-output $summary | Out-Null
          .venv\Scripts\python.exe tools\release.py write-manifest `
            --version-tag "${{ inputs.release_tag }}" `
            --asset-name (Split-Path $zip -Leaf) `
            --sha256 $zipSha `
            --installer-asset-name (Split-Path $installer -Leaf) `
            --installer-sha256 $installerSha `
            --output dist\BlindRSS-update.json `
            --signing-thumbprint $thumbprint `
            --notes-summary-file $summary
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: BlindRSS-windows-${{ inputs.release_tag }}
          path: |
            dist/BlindRSS-v*.zip
            dist/BlindRSS-Setup-v*.exe
            dist/BlindRSS-update.json

      - name: Upload release assets
        if: ${{ inputs.publish_assets }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" "${{ steps.manifest.outputs.zip }}" "${{ steps.manifest.outputs.installer }}" dist\BlindRSS-update.json --clobber

  macos:
    name: Build macOS Artifact
    runs-on: macos-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || inputs.release_tag) || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install macOS build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Build macOS package
        env:
          BLINDRSS_VLC_VERSION: "3.0.23"
        run: |
          chmod +x build.sh
          ./build.sh build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: BlindRSS-macos-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}
          path: dist/BlindRSS-macos-*.zip

      - name: Upload release asset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_assets }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/BlindRSS-macos-*.zip --clobber

      - name: Publish macOS update manifest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_assets }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(dist/BlindRSS-macos-*.zip); ASSET="${ASSETS[0]}"
          ASSET_NAME="$(basename "$ASSET")"
          SHA="$(shasum -a 256 "$ASSET" | awk '{print $1}')"
          python tools/release.py write-manifest \
            --version-tag "${{ inputs.release_tag }}" \
            --asset-name "$ASSET_NAME" \
            --sha256 "$SHA" \
            --output dist/BlindRSS-update-macos.json
          gh release upload "${{ inputs.release_tag }}" dist/BlindRSS-update-macos.json --clobber

  linux:
    name: Build Linux Artifact
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || inputs.release_tag) || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            vlc libvlc-dev ffmpeg \
            libgtk-3-dev libwebkit2gtk-4.0-dev libsdl2-dev libnotify-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev \
            libjpeg-dev libpng-dev libtiff-dev libsm-dev libxtst-dev

      - name: Build Linux package
        run: |
          chmod +x build.sh
          ./build.sh build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: BlindRSS-linux-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}
          path: dist/BlindRSS-linux-*.tar.gz

      - name: Upload release asset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_assets }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/BlindRSS-linux-*.tar.gz --clobber

      - name: Publish Linux update manifest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_assets }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(dist/BlindRSS-linux-*.tar.gz); ASSET="${ASSETS[0]}"
          ASSET_NAME="$(basename "$ASSET")"
          SHA="$(sha256sum "$ASSET" | awk '{print $1}')"
          python tools/release.py write-manifest \
            --version-tag "${{ inputs.release_tag }}" \
            --asset-name "$ASSET_NAME" \
            --sha256 "$SHA" \
            --output dist/BlindRSS-update-linux.json
          gh release upload "${{ inputs.release_tag }}" dist/BlindRSS-update-linux.json --clobber

  # The updater only sees a published Latest release, so the release stays a
  # draft until every platform's assets and manifests are on it.
  publish:
    name: Verify assets and publish as Latest
    needs: [windows, macos, linux]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish_release && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - name: Verify every platform uploaded its assets
        run: |
          v="${TAG#v}"
          have="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          missing=0
          for want in "BlindRSS-v$v.zip" "BlindRSS-Setup-v$v.exe" BlindRSS-update.json \
                      "BlindRSS-linux-v$v.tar.gz" BlindRSS-update-linux.json \
                      "BlindRSS-macos-v$v.zip" BlindRSS-update-macos.json; do
            if ! grep -qxF "$want" <<<"$have"; then echo "::error::Missing asset $want"; missing=1; fi
          done
          [ "$missing" = 0 ]

      - name: Publish as Latest
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Verify the updater will see it
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$TAG" ]; then
            echo "::error::/releases/latest is $latest, expected $TAG"
            exit 1
          fi
          echo "Published $TAG as Latest."
